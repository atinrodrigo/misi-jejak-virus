<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misi Jejak Virus</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        darkblue: '#10264D',
                        darkpurple: '#342665',
                        textblue: '#172554',
                        accentcyan: '#67E8F9',
                        accentpink: '#F9A8D4',
                        accentyellow: '#FDE68A',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #10264D 0%, #342665 100%);
            margin: 0;
            overflow: hidden; /* Prevent scrolling */
            touch-action: manipulation;
        }

        /* Energy Cursor */
        #cursor {
            position: absolute;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(103, 232, 249, 0.4);
            box-shadow: 0 0 20px #67E8F9, inset 0 0 10px #67E8F9;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            transition: width 0.2s, height 0.2s;
        }

        #cursor.active {
            width: 60px;
            height: 60px;
            background: rgba(253, 230, 138, 0.5); /* Yellow accent on hover */
            box-shadow: 0 0 25px #FDE68A;
        }

        /* Progress Ring */
        .progress-ring-circle {
            transition: stroke-dashoffset 0.1s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* Animations */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .animate-pop {
            animation: pop 0.4s ease-out;
        }

        /* Background Decorations */
        .deco-svg {
            position: absolute;
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }
        
        .floating {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="text-white h-screen flex flex-col items-center justify-center">

    <!-- Background Decorations -->
    <svg class="deco-svg floating w-32 md:w-48 top-10 left-10 text-accentcyan" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
    <svg class="deco-svg floating w-40 md:w-56 bottom-10 right-10 text-accentpink" style="animation-delay: -3s;" fill="currentColor" viewBox="0 0 24 24"><path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10zm-1-11v6h2v-6h-2zm0-4v2h2V7h-2z"/></svg>
    <svg class="deco-svg floating w-24 md:w-36 top-20 right-20 text-accentyellow" style="animation-delay: -1.5s;" fill="currentColor" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>

    <!-- Glowing Hand Cursor -->
    <div id="cursor">
        <svg width="60" height="60" class="absolute pointer-events-none">
            <circle class="progress-ring-circle" id="progressRing" cx="30" cy="30" r="26" fill="transparent" stroke="#FDE68A" stroke-width="6" stroke-dasharray="163.36" stroke-dashoffset="163.36" />
        </svg>
    </div>

    <!-- START SCREEN -->
    <div id="startScreen" class="relative z-10 flex flex-col items-center justify-center w-full h-full px-4 text-center">
        <div class="mb-4">
            <h1 class="text-5xl md:text-7xl font-black text-white drop-shadow-lg tracking-wide mb-2 uppercase">
                Misi Jejak Virus
            </h1>
            <h2 class="text-xl md:text-2xl font-bold text-accentcyan drop-shadow-md">
                Kenali punca dan penularan influenza
            </h2>
        </div>
        
        <p class="mt-8 mb-6 text-lg md:text-xl font-semibold text-accentyellow bg-white/10 px-6 py-2 rounded-full backdrop-blur-sm">
            Gerakkan tangan, pilih jawapan!
        </p>

        <div class="flex flex-col sm:flex-row gap-4 mt-4">
            <button onclick="startGame(true)" class="group relative px-8 py-4 bg-accentcyan text-textblue text-xl font-bold rounded-2xl shadow-[0_6px_0_#0891b2] hover:shadow-[0_2px_0_#0891b2] hover:translate-y-1 transition-all">
                Main dengan Kamera
            </button>
            <button onclick="startGame(false)" class="group relative px-8 py-4 bg-accentpink text-textblue text-xl font-bold rounded-2xl shadow-[0_6px_0_#be185d] hover:shadow-[0_2px_0_#be185d] hover:translate-y-1 transition-all">
                Main dengan Sentuhan
            </button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameScreen" class="hidden relative z-10 flex flex-col w-full h-full p-4 md:p-8 max-w-6xl mx-auto">
        <!-- Top Bar -->
        <div class="flex justify-between items-center w-full bg-white/10 backdrop-blur-md rounded-2xl px-6 py-3 mb-4 shadow-sm border border-white/20">
            <div class="text-lg md:text-xl font-bold text-accentcyan">
                Soalan <span id="questionCount">1/5</span>
            </div>
            <div class="text-lg md:text-xl font-bold text-accentyellow">
                Markah: <span id="scoreDisplay">0</span>
            </div>
        </div>

        <!-- Main Game Area -->
        <div class="flex flex-col flex-1 justify-center w-full">
            
            <!-- Question Box -->
            <div class="bg-white text-textblue rounded-3xl shadow-xl p-6 md:p-8 mb-6 text-center w-full max-w-4xl mx-auto transform transition-transform">
                <h3 id="questionText" class="text-[22px] md:text-[32px] font-bold leading-tight">
                    Memuatkan soalan...
                </h3>
            </div>

            <!-- Answers Grid -->
            <div id="answersGrid" class="flex flex-col md:flex-row gap-4 w-full max-w-4xl mx-auto">
                <!-- Answer Buttons dynamically inserted here -->
            </div>

            <!-- Feedback Area -->
            <div id="feedbackArea" class="hidden mt-6 flex flex-col items-center bg-white/95 rounded-2xl p-6 shadow-2xl max-w-4xl mx-auto w-full text-textblue animate-pop">
                <h4 id="feedbackTitle" class="text-2xl md:text-3xl font-black mb-2 uppercase"></h4>
                <p id="feedbackText" class="text-lg md:text-xl font-semibold mb-4 text-center"></p>
                <button id="nextBtn" class="px-8 py-3 bg-accentcyan text-textblue text-lg md:text-xl font-bold rounded-xl shadow-[0_4px_0_#0891b2] hover:shadow-[0_1px_0_#0891b2] hover:translate-y-1 transition-all">
                    Seterusnya
                </button>
            </div>
        </div>

        <!-- Camera Preview Panel -->
        <div id="cameraPanel" class="hidden absolute bottom-4 right-4 md:bottom-8 md:right-8 w-32 h-24 md:w-48 md:h-36 bg-black rounded-xl overflow-hidden border-4 border-accentcyan shadow-2xl z-50">
            <video id="video" class="hidden" autoplay playsinline></video>
            <canvas id="cameraCanvas" class="w-full h-full object-cover transform -scale-x-100"></canvas>
            <div class="absolute bottom-1 left-1 bg-black/50 px-2 py-1 rounded text-[10px] font-bold text-accentcyan">Kamera Aktif</div>
        </div>
    </div>

    <!-- END SCREEN -->
    <div id="endScreen" class="hidden relative z-10 flex flex-col items-center justify-center w-full h-full px-4 text-center">
        <h2 class="text-4xl md:text-6xl font-black text-accentyellow mb-4 drop-shadow-lg">MISI SELESAI!</h2>
        <div class="bg-white text-textblue rounded-3xl p-8 max-w-lg w-full shadow-2xl mb-8">
            <p class="text-xl md:text-2xl font-bold mb-2">Markah Akhir Anda:</p>
            <p id="finalScore" class="text-6xl font-black text-darkpurple mb-4">0/5</p>
            <p id="endMessage" class="text-lg md:text-xl font-semibold text-gray-700"></p>
        </div>
        <button onclick="location.reload()" class="px-10 py-4 bg-accentcyan text-textblue text-xl font-bold rounded-2xl shadow-[0_6px_0_#0891b2] hover:shadow-[0_2px_0_#0891b2] hover:translate-y-1 transition-all">
            Main Semula
        </button>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="hidden fixed inset-0 bg-darkblue/90 z-[10000] flex flex-col items-center justify-center">
        <div class="w-16 h-16 border-4 border-accentcyan border-t-accentpink rounded-full animate-spin mb-4"></div>
        <p class="text-white text-xl font-bold font-sans">Memulakan Mod Kamera...</p>
    </div>

    <script>
        // --- Game Data ---
        const questions = [
            {
                q: "Apakah punca utama jangkitan influenza?",
                options: ["Virus", "Bakteria", "Kuman air"],
                answer: 0,
                explanation: "Influenza berpunca daripada jangkitan virus yang menyerang sistem pernafasan manusia."
            },
            {
                q: "Bagaimanakah virus influenza mudah tersebar?",
                options: ["Gigitan nyamuk", "Titisan cecair", "Makanan tercemar"],
                answer: 1,
                explanation: "Virus tersebar melalui titisan cecair di udara apabila pesakit batuk, bersin atau bercakap."
            },
            {
                q: "Apakah simptom (tanda-tanda) biasa bagi pesakit influenza?",
                options: ["Rambut gugur", "Sakit gigi", "Demam panas"],
                answer: 2,
                explanation: "Tanda biasa influenza ialah demam panas yang mengejut, batuk, selsema dan sakit badan."
            },
            {
                q: "Di manakah virus influenza sangat mudah merebak?",
                options: ["Tempat sesak", "Kawasan lapang", "Dalam peti sejuk"],
                answer: 0,
                explanation: "Virus mudah berjangkit di tempat yang sesak dan tertutup kerana jarak orang yang terlalu rapat."
            },
            {
                q: "Apakah cara terbaik untuk mengelakkan jangkitan ini?",
                options: ["Makan banyak gula", "Basuh tangan", "Tidur lewat malam"],
                answer: 1,
                explanation: "Kerap membasuh tangan dengan sabun dapat membunuh partikel virus yang melekat pada tangan kita."
            }
        ];

        let currentQIndex = 0;
        let score = 0;
        let useCamera = false;
        let gameActive = false;

        // --- Camera & Hand Tracking Variables ---
        const videoElement = document.getElementById('video');
        const canvasElement = document.getElementById('cameraCanvas');
        const canvasCtx = canvasElement.getContext('2d');
        const cursor = document.getElementById('cursor');
        const progressRing = document.getElementById('progressRing');
        
        let camera;
        let hands;
        const CIRCUMFERENCE = 163.36; // 2 * pi * r (r=26)
        
        let hoverTarget = null;
        let hoverStartTime = 0;
        const HOVER_DURATION = 2000; // 2 seconds to select

        // --- Game Logic ---
        function startGame(withCamera) {
            useCamera = withCamera;
            document.getElementById('startScreen').classList.add('hidden');
            
            if (withCamera) {
                document.getElementById('loadingOverlay').classList.remove('hidden');
                initMediaPipe();
            } else {
                document.getElementById('gameScreen').classList.remove('hidden');
                loadQuestion();
                gameActive = true;
            }
        }

        function loadQuestion() {
            if (currentQIndex >= questions.length) {
                endGame();
                return;
            }

            const q = questions[currentQIndex];
            document.getElementById('questionCount').innerText = `${currentQIndex + 1}/${questions.length}`;
            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('questionText').innerText = q.q;
            
            const grid = document.getElementById('answersGrid');
            grid.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = `answer-btn flex-1 bg-white text-textblue text-[20px] md:text-[24px] font-bold rounded-2xl p-4 md:p-6 text-center cursor-pointer shadow-[0_6px_0_#cbd5e1] hover:shadow-[0_2px_0_#cbd5e1] hover:translate-y-1 transition-all h-full min-h-[100px] flex items-center justify-center select-none border-2 border-transparent focus:outline-none`;
                btn.innerText = opt;
                btn.dataset.index = index;
                
                // Allow touch/click always
                btn.addEventListener('click', () => handleAnswer(index, btn));
                grid.appendChild(btn);
            });

            document.getElementById('feedbackArea').classList.add('hidden');
            gameActive = true;
        }

        function handleAnswer(selectedIndex, btnElement) {
            if (!gameActive) return;
            gameActive = false; // Prevent multiple answers
            resetCursorHover(); // Stop circle animation if camera mode

            const q = questions[currentQIndex];
            const isCorrect = (selectedIndex === q.answer);
            
            // Highlight buttons
            const allBtns = document.querySelectorAll('.answer-btn');
            allBtns.forEach(b => {
                b.disabled = true;
                b.classList.remove('hover:translate-y-1', 'hover:shadow-[0_2px_0_#cbd5e1]', 'cursor-pointer');
                if (parseInt(b.dataset.index) === q.answer) {
                    b.classList.replace('bg-white', 'bg-green-400');
                    b.classList.replace('text-textblue', 'text-white');
                    b.classList.replace('shadow-[0_6px_0_#cbd5e1]', 'shadow-[0_6px_0_#16a34a]');
                    b.classList.add('border-green-500', 'animate-pop');
                } else if (parseInt(b.dataset.index) === selectedIndex && !isCorrect) {
                    b.classList.replace('bg-white', 'bg-red-400');
                    b.classList.replace('text-textblue', 'text-white');
                    b.classList.replace('shadow-[0_6px_0_#cbd5e1]', 'shadow-[0_6px_0_#dc2626]');
                    b.classList.add('border-red-500');
                } else {
                    b.classList.add('opacity-50');
                }
            });

            // Show feedback
            const feedbackArea = document.getElementById('feedbackArea');
            const title = document.getElementById('feedbackTitle');
            const text = document.getElementById('feedbackText');
            const nextBtn = document.getElementById('nextBtn');

            if (isCorrect) {
                score++;
                document.getElementById('scoreDisplay').innerText = score;
                title.innerText = "TEPAT!";
                title.className = "text-2xl md:text-3xl font-black mb-2 uppercase text-green-500";
            } else {
                title.innerText = "KURANG TEPAT";
                title.className = "text-2xl md:text-3xl font-black mb-2 uppercase text-red-500";
            }
            
            text.innerText = q.explanation;
            feedbackArea.classList.remove('hidden');
            
            // Need a one-time click listener for next button that works with both mouse and hover
            nextBtn.onclick = () => {
                currentQIndex++;
                loadQuestion();
            };
            nextBtn.classList.add('answer-btn'); // Allow camera to hover it
            nextBtn.dataset.next = "true";
        }

        function endGame() {
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('endScreen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = `${score}/5`;
            
            const msg = document.getElementById('endMessage');
            if (score === 5) msg.innerText = "Hebat! Anda saintis yang cemerlang!";
            else if (score >= 3) msg.innerText = "Bagus! Anda faham asas pencegahan virus.";
            else msg.innerText = "Jangan putus asa, mari cuba sekali lagi!";
            
            if (useCamera) {
                cursor.style.display = 'none';
            }
        }

        // --- MediaPipe Hand Tracking Setup ---
        function initMediaPipe() {
            hands = new Hands({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                }
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.7
            });

            hands.onResults(onResults);

            camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({image: videoElement});
                },
                width: 640,
                height: 480
            });
            camera.start().then(() => {
                document.getElementById('loadingOverlay').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                document.getElementById('cameraPanel').classList.remove('hidden');
                cursor.style.display = 'flex';
                loadQuestion();
            }).catch(err => {
                alert("Gagal mengakses kamera. Bermain dengan mod sentuhan.");
                document.getElementById('loadingOverlay').classList.add('hidden');
                startGame(false);
            });
        }

        function onResults(results) {
            if (!useCamera) return;

            // Draw small camera preview
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#67E8F9', lineWidth: 2});
                drawLandmarks(canvasCtx, landmarks, {color: '#F9A8D4', lineWidth: 1, radius: 2});
                
                // Get Index Finger Tip (Landmark 8)
                const indexTip = landmarks[8];
                
                // Screen coordinates (Mirrored horizontally)
                const screenX = (1 - indexTip.x) * window.innerWidth;
                const screenY = indexTip.y * window.innerHeight;

                updateCursor(screenX, screenY);
                checkIntersections(screenX, screenY);
            } else {
                // Hand lost
                resetCursorHover();
            }
            canvasCtx.restore();
        }

        function updateCursor(x, y) {
            cursor.style.left = `${x}px`;
            cursor.style.top = `${y}px`;
        }

        function checkIntersections(x, y) {
            if (!gameActive && document.getElementById('feedbackArea').classList.contains('hidden')) return;

            // Get elements under cursor
            const elements = document.elementsFromPoint(x, y);
            // Find if any is a valid interactable button
            const btn = elements.find(el => el.classList.contains('answer-btn') && !el.disabled);

            if (btn) {
                if (hoverTarget !== btn) {
                    // New target
                    hoverTarget = btn;
                    hoverStartTime = Date.now();
                    cursor.classList.add('active');
                } else {
                    // Continuing hover
                    const elapsed = Date.now() - hoverStartTime;
                    const progress = Math.min(elapsed / HOVER_DURATION, 1);
                    
                    // Update SVG Ring
                    const offset = CIRCUMFERENCE - (progress * CIRCUMFERENCE);
                    progressRing.style.strokeDashoffset = offset;

                    if (progress >= 1) {
                        // Time reached, trigger action
                        if (btn.dataset.next) {
                            btn.click(); // Next button
                        } else {
                            handleAnswer(parseInt(btn.dataset.index), btn);
                        }
                    }
                }
            } else {
                resetCursorHover();
            }
        }

        function resetCursorHover() {
            hoverTarget = null;
            hoverStartTime = 0;
            progressRing.style.strokeDashoffset = CIRCUMFERENCE;
            cursor.classList.remove('active');
        }

    </script>
</body>
</html>
